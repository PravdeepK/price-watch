<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Price Watch</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
<style>
  /* A read-only copy of the Price Watch cards, in the same colours. */
  :root {
    --bg: #f6f5f2; --surface: #ffffff; --surface-2: #efede8; --border: #e2dfd8;
    --text: #1d1b18; --muted: #6d6860; --accent: #1f5fd1;
    --good: #1c7c43; --good-bg: #e2f3e8; --warn: #9a5b00; --warn-bg: #fbf0dc;
    --bad: #b3261e; --bad-bg: #fbe4e2; --special: #7a3fc4; --special-bg: #efe6fb;
    --radius: 12px; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.05); --pic-bg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212; --surface: #1c1c1e; --surface-2: #262628; --border: #333336;
      --text: #f2f1ee; --muted: #a09c94; --accent: #6ea0ff;
      --good: #6fd197; --good-bg: #173222; --warn: #f0b85c; --warn-bg: #3a2c12;
      --bad: #ff8a80; --bad-bg: #3b1a18; --special: #c7a4ff; --special-bg: #2d2140;
      --shadow: 0 1px 2px rgba(0,0,0,.4); --pic-bg: #f4f4f4;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1360px; margin: 0 auto; padding: 0 16px 48px; }
  header { padding: 20px 0 6px; }
  header h1 { font-size: 22px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; margin: 4px 0 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
  .grid > * { min-width: 0; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow); }
  .pic { position: relative; aspect-ratio: 4 / 3; background: var(--pic-bg); }
  .pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; padding: 10px; }
  .pic .noimg { position: absolute; inset: 0; display: grid; place-items: center; font-size: 44px; opacity: .45; background: var(--surface-2); }
  .site-tag { position: absolute; top: 8px; right: 8px; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: rgba(0,0,0,.6); color: #fff; }
  .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .title { font-weight: 600; font-size: 14px; line-height: 1.3; }
  .title a { color: inherit; text-decoration: none; }
  .price { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .price .from { font-size: 13px; font-weight: 500; color: var(--muted); margin-right: 4px; }
  .was { text-decoration: line-through; color: var(--muted); font-size: 13px; font-weight: 400; margin-left: 6px; }
  .eds { display: grid; gap: 2px; font-size: 13px; }
  .eds > div { display: flex; justify-content: space-between; gap: 8px; }
  .eds span:first-child { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .eds span:last-child { font-weight: 600; white-space: nowrap; }
  .badges { display: flex; flex-wrap: wrap; gap: 4px; }
  .badge { font-size: 12px; padding: 3px 8px; border-radius: 6px; font-weight: 500; }
  .badge.good { background: var(--good-bg); color: var(--good); }
  .badge.bad { background: var(--bad-bg); color: var(--bad); }
  .badge.special { background: var(--special-bg); color: var(--special); }
  .meta { font-size: 13px; color: var(--muted); }
  .btn { display: inline-block; margin-top: auto; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); color: var(--text); text-decoration: none; font-size: 13px; font-weight: 500; width: fit-content; }
  .empty { text-align: center; color: var(--muted); padding: 48px 16px; border: 1px dashed var(--border); border-radius: var(--radius); grid-column: 1 / -1; }
  @media (max-width: 560px) {
    .grid { grid-template-columns: 1fr; gap: 10px; }
    .card { display: grid; grid-template-columns: 104px minmax(0, 1fr); }
    .card .pic { aspect-ratio: 1; align-self: start; margin: 10px 0 10px 10px; border-radius: 8px; overflow: hidden; }
    .card .site-tag { display: none; }
    .price { font-size: 20px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>💰 Price Watch</h1></header>
  <p class="sub" id="sub">Loading…</p>
  <div class="grid" id="grid"></div>
</div>
<script>
// Read-only: this page can only show the watchlist, never change it.
const $ = (s) => document.querySelector(s);
function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat(Infinity)) if (c != null && c !== false) el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return el;
}
const money = (c, cur) => c == null ? "--" : c === 0 ? "Free"
  : "$" + (c / 100).toLocaleString("en-CA", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + (cur && cur !== "CAD" ? ` ${cur}` : "");
function ago(iso) {
  if (!iso) return "not checked yet";
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  return m < 1 ? "checked just now" : m < 60 ? `checked ${m} min ago` : `checked ${Math.round(m / 60)} h ago`;
}

function card(it) {
  const priced = it.editions.filter((e) => e.price != null);
  const low = priced.reduce((a, e) => (!a || e.price < a.price ? e : a), null);
  const known = it.editions.filter((e) => e.in_stock != null);
  const out = known.length && known.every((e) => e.in_stock === false);
  const off = Math.max(0, ...priced.filter((e) => e.regular > e.price).map((e) => Math.round((1 - e.price / e.regular) * 100)));
  const badges = [];
  if (out) badges.push(["bad", "Out of stock"]);
  if (off) badges.push(["good", `On sale −${off}%`]);
  if (it.target != null && priced.some((e) => e.price <= it.target)) badges.push(["good", "🎯 At target"]);
  if (it.not_canadian) badges.push(["special", "US store"]);
  const icon = /steam|playstation/i.test(it.site) ? "🎮" : "🛒";
  return h("div", { class: "card" },
    h("div", { class: "pic" },
      it.image ? h("img", { src: it.image, alt: "", loading: "lazy", referrerpolicy: "no-referrer",
        onerror: (e) => e.currentTarget.replaceWith(h("div", { class: "noimg" }, icon)) }) : h("div", { class: "noimg" }, icon),
      h("span", { class: "site-tag" }, it.site)),
    h("div", { class: "body" },
      h("div", { class: "title" }, it.name),
      it.editions.length === 1
        ? h("div", { class: "price" }, money(it.editions[0].price, it.editions[0].currency),
            it.editions[0].regular ? h("span", { class: "was" }, money(it.editions[0].regular, it.editions[0].currency)) : null)
        : h("div", { class: "price" }, low ? [h("span", { class: "from" }, "from"), money(low.price, low.currency)] : "--"),
      it.editions.length > 1 ? h("div", { class: "eds" }, it.editions.map((e) => h("div", {},
        h("span", {}, e.label || ""), h("span", {}, e.in_stock === false ? "sold out " : "", money(e.price, e.currency))))) : null,
      badges.length ? h("div", { class: "badges" }, badges.map(([c, t]) => h("span", { class: "badge " + c }, t))) : null,
      h("div", { class: "meta" }, it.site + " · " + ago(it.last_checked)),
      h("a", { class: "btn", href: it.url, target: "_blank", rel: "noopener noreferrer" }, "View at store ↗")));
}

async function load() {
  try {
    const res = await fetch(location.pathname.replace(/\/$/, "") + "/data");
    const d = await res.json();
    $("#sub").textContent = `${d.items.length} item${d.items.length === 1 ? "" : "s"} being watched · prices are checked every 30 minutes`;
    $("#grid").replaceChildren(...(d.items.length ? d.items.map(card) : [h("div", { class: "empty" }, "Nothing is being watched right now.")]));
  } catch { $("#sub").textContent = "Could not load the list. Try again in a moment."; }
}
load();
setInterval(() => { if (!document.hidden) load(); }, 120000);
</script>
</body>
</html>
